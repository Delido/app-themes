  background-color: var(--color-primary-light); color: var(--au-accent-light);
}

  background-color: rgba(255,255,255,.04); border-color: var(--au-line-strong); color: var(--au-text);
}

/* Weitere vollflächige Akzentbalken nur getönt */

:root.dark-mode .content-comment-window-actions {
  background-color: color-mix(in srgb, var(--au-accent) 16%, var(--au-5));
  color: var(--au-text-strong);

/* Karten */
:root.dark-mode .card {
  border: 1px solid var(--au-line);
  border-radius: 14px;

}

:root.dark-mode .grid-card:hover { box-shadow: var(--au-glow); }
